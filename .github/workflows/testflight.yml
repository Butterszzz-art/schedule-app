name: TestFlight

# Manual only: a TestFlight upload burns a build number and Apple Developer
# resources, so this doesn't run on every push -- trigger it from the
# Actions tab (or `gh workflow run testflight.yml`) when you actually want
# to ship a build.
on:
  workflow_dispatch: {}

jobs:
  beta:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web app dependencies
        working-directory: scheduleapp
        run: npm ci

      - name: Sync the Capacitor iOS project
        working-directory: scheduleapp
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: scheduleapp/ios/App

      - name: Build and upload to TestFlight
        working-directory: scheduleapp/ios/App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
